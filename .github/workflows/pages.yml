# 推到 main 时：跑快速检查，构建单文件游戏，发布到 GitHub Pages（在线试玩）。
name: check-and-pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Game/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: cp -r public/. dist/
      - if: ${{ !github.event.repository.private }}   # 私有仓库不能用免费 Pages，只跑检查
        uses: actions/upload-pages-artifact@v3
        with:
          path: Game/dist
  deploy:
    needs: build
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
